name: Build, test and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  macos:
    name: macOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            package: true
          - os: macos-15-intel
            package: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Process matching and owned-process tests
        run: bash macos/test.sh
      - name: Build Universal applications
        run: bash macos/build.sh
      - name: Verify signatures, architectures and read-only status
        run: bash macos/verify.sh
      - name: Package apps
        if: matrix.package
        run: bash macos/package.sh
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: matrix.package
        with:
          name: macOS-universal
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: windows-11-arm
            runtime: win-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Core and Windows owned-process tests
        shell: pwsh
        run: ./windows/test.ps1
      - name: Build self-contained app, smoke test and package
        shell: pwsh
        run: ./windows/build.ps1 -Runtime '${{ matrix.runtime }}'
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-${{ matrix.runtime }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tested release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" *.zip SHA256SUMS.txt \
            --verify-tag --title "$RELEASE_TAG" \
            --notes 'macOS Universal、Windows x64、Windows ARM64 本地检查与关闭工具。下载对应 ZIP 后完整解压。所有构建与测试已通过；工具没有运行时联网功能，无法保证网络隔离。使用前保存工作。'
